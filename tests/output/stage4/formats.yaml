- {id: bd04, item: "Built-in number format Short Date and Long Date", value: "1", format: "m/d/yyyy", text: "1/1/1900", note: "edge first serial"}
- {id: bt01, item: "Built-in number format Time", value: "0.75", format: "h:mm:ss AM/PM", text: "6:00:00 PM"}
