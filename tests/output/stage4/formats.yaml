# Stage 4 number format display cases (date/time, sections, conditions, fractions, custom formats).
# Written 2026-11-06 by tests-345-agent. Same schema as stage3/formats.yaml.
# Sources: Number format codes https://support.microsoft.com/en-us/office/number-format-codes-5026bbd6-04bc-48cd-bf33-80f18b4eae68
#   Format a date the way you want https://support.microsoft.com/en-us/office/format-a-date-the-way-you-want-8e10019e-d5d8-47a1-ba95-db95123d273e
#   TEXT function https://support.microsoft.com/en-us/excel/functions/text-function
# Value anchor: 39448.75 is 2008-01-01 18:00 (a Tuesday).
cases:
# date and time tokens
- {id: dt01, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "39448.75", format: "m/d/yyyy", text: "1/1/2008"}
- {id: dt02, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "39448.75", format: "mm/dd/yy", text: "01/01/08"}
- {id: dt03, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "39448.75", format: "mmm", text: "Jan"}
- {id: dt04, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "39448.75", format: "mmmm", text: "January"}
- {id: dt05, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "39448.75", format: "mmmmm", text: "J"}
- {id: dt06, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "39448.75", format: "ddd", text: "Tue"}
- {id: dt07, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "39448.75", format: "dddd", text: "Tuesday"}
- {id: dt08, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "39448.75", format: "h:mm AM/PM", text: "6:00 PM"}
- {id: dt09, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "39448.75", format: "hh:mm:ss", text: "18:00:00"}
- {id: dt10, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "0.5", format: "h:mm a/p", text: "12:00 p"}
- {id: dt11, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "0", format: "h:mm AM/PM", text: "12:00 AM", note: "edge midnight"}
- {id: dt12, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "0.0430902777777778", format: "h:mm:ss.00", text: "1:02:03.00", note: "0.04309027... is 1:02:03"}
- {id: dt13, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "1.5", format: "[h]:mm", text: "36:00"}
- {id: dt14, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "0.5", format: "[mm]:ss", text: "720:00"}
- {id: dt15, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "0.01", format: "[ss]", text: "864"}
- {id: dt16, item: "TEXT format codes: date and time tokens d m y h s AM/PM and elapsed [h] [m] [s]", value: "0.5", format: "h:m", text: "12:0", note: "m after h is minutes"}
# sections and conditions
- {id: sc01, item: "TEXT format codes: sections and conditions", value: "0", format: '0;-0;"zero";"text:"@', text: "zero"}
- {id: sc02, item: "TEXT format codes: sections and conditions", value: "-3", format: "0;0", text: "3", note: "second section has no minus"}
- {id: sc03, item: "TEXT format codes: sections and conditions", value: "150", format: '[>100]"big";[<=100]"small"', text: "big"}
- {id: sc04, item: "TEXT format codes: sections and conditions", value: "50", format: '[>100]"big";[<=100]"small"', text: "small"}
- {id: sc05, item: "TEXT format codes: sections and conditions", value: "100", format: '[>100]"big";[<=100]"small"', text: "small", note: "edge on boundary"}
- {id: sc06, item: "TEXT format codes: sections and conditions", value: "x", format: '0;-0;0', text: "x", note: "no text section: text unchanged"}
# fractions
- {id: fr01, item: "TEXT format codes: fractions", value: "5.25", format: "# ?/?", text: "5 1/4"}
- {id: fr02, item: "TEXT format codes: fractions", value: "0.5", format: "?/?", text: "1/2"}
- {id: fr03, item: "TEXT format codes: fractions", value: "1.25", format: "?/?", text: "5/4", note: "no integer part"}
- {id: fr04, item: "TEXT format codes: fractions", value: "5", format: "# ?/?", text: "5    ", confidence: low, note: "whole number pads fraction width"}
- {id: fr05, item: "TEXT format codes: fractions", value: "0.333333333", format: "# ??/??", text: "  1/3 ", confidence: low}
