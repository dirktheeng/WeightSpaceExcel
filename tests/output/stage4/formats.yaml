- {id: bt03, item: "Built-in number format Time", value: "1.25", format: "h:mm", text: "6:00", note: "day part dropped without brackets"}
- {id: bf01, item: "Built-in number format Fraction", value: "0.75", format: "# ?/4", text: " 3/4", confidence: medium, note: "integer 0 shows as space"}
- {id: bf02, item: "Built-in number format Fraction", value: "2.5", format: "# ?/2", text: "2 1/2"}
- {id: bf03, item: "Built-in number format Fraction", value: "1.3", format: "# ?/10", text: "1 3/10"}
- {id: bsp01, item: "Built-in number format Special (zip phone SSN)", value: "1234", format: "00000", text: "01234"}
