# Stage 4 conformance cases: date and time functions and date coercion.
# Written 2026-11-06 by tests-345-agent. Format and conventions: see stage3/cases_math.yaml header.
# Dates are serial numbers in the 1900 date system (1 = 1900-01-01, 60 = the fictitious 1900-02-29).
# Serial anchors used by hand: 2000-01-01 = 36526, 2008-01-01 = 39448, 2011-01-01 = 40544,
# 2012-01-01 = 40909, 2024-01-01 = 44927 (a Monday).
# Date text typed in cells (e.g. "1/1/2008") is read as a date serial (en-US, month first).
cases:
# DATE https://support.microsoft.com/en-us/excel/functions/date-function
- {id: date01, requires: [DATE], cells: {A1: "=DATE(2008,1,1)"}, expect: {A1: 39448}}
- {id: date02, requires: [DATE], cells: {A1: "=DATE(2008,14,2)"}, expect: {A1: 39846}, note: "month 14 rolls to Feb 2009"}
- {id: date03, requires: [DATE], cells: {A1: "=DATE(2008,1,-15)"}, expect: {A1: 39432}, note: "Dec 16 2007"}
- {id: date04, requires: [DATE], cells: {A1: "=DATE(108,1,2)"}, expect: {A1: 39449}, note: "year below 1900 adds 1900"}
- {id: date05, requires: [DATE], cells: {A1: "=DATE(1900,3,1)"}, expect: {A1: 61}, note: "edge: 1900 leap-year bug"}
- {id: date06, requires: [DATE], cells: {A1: "=DATE(1900,1,1)"}, expect: {A1: 1}}
- {id: date07, requires: [DATE], cells: {A1: "=DATE(10000,1,1)"}, expect: {A1: {error: "#NUM!"}}}
- {id: date08, requires: [DATE], cells: {A1: "=DATE(-1,1,1)"}, expect: {A1: {error: "#NUM!"}}}
- {id: date09, requires: [DATE], cells: {A1: '=DATE("x",1,1)'}, expect: {A1: {error: "#VALUE!"}}}
# DATEDIF https://support.microsoft.com/en-us/excel/functions/datedif-function
- {id: datedif01, requires: [DATEDIF], cells: {A1: "1/1/2001", B1: "1/1/2003", C1: '=DATEDIF(A1,B1,"Y")'}, expect: {C1: 2}}
- {id: datedif02, requires: [DATEDIF], cells: {A1: "6/1/2001", B1: "8/15/2002", C1: '=DATEDIF(A1,B1,"D")'}, expect: {C1: 440}}
- {id: datedif03, requires: [DATEDIF], cells: {A1: "6/1/2001", B1: "8/15/2002", C1: '=DATEDIF(A1,B1,"YD")'}, expect: {C1: 75}}
- {id: datedif04, requires: [DATEDIF], cells: {A1: "6/1/2001", B1: "8/15/2002", C1: '=DATEDIF(A1,B1,"M")'}, expect: {C1: 14}}
- {id: datedif05, requires: [DATEDIF], cells: {A1: "6/1/2001", B1: "6/1/2001", C1: '=DATEDIF(A1,B1,"D")'}, expect: {C1: 0}, note: "edge: same day"}
- {id: datedif06, requires: [DATEDIF], cells: {A1: "1/1/2003", B1: "1/1/2001", C1: '=DATEDIF(A1,B1,"Y")'}, expect: {C1: {error: "#NUM!"}}, note: "start after end"}
- {id: datedif07, requires: [DATEDIF], cells: {A1: "1/1/2001", B1: "1/1/2003", C1: '=DATEDIF(A1,B1,"Q")'}, expect: {C1: {error: "#NUM!"}}, confidence: medium}
# DATEVALUE https://support.microsoft.com/en-us/excel/functions/datevalue-function
- {id: dv01, requires: [DATEVALUE], cells: {A1: '=DATEVALUE("8/22/2011")'}, expect: {A1: 40777}}
- {id: dv02, requires: [DATEVALUE], cells: {A1: '=DATEVALUE("22-MAY-2011")'}, expect: {A1: 40685}}
- {id: dv03, requires: [DATEVALUE], cells: {A1: '=DATEVALUE("2011/02/23")'}, expect: {A1: 40597}}
- {id: dv04, requires: [DATEVALUE], cells: {A1: '=DATEVALUE("1/1/1900")'}, expect: {A1: 1}, note: "edge: first date"}
- {id: dv05, requires: [DATEVALUE], cells: {A1: '=DATEVALUE("8/22/2011 6:35 AM")'}, expect: {A1: 40777}, note: "time part ignored"}
- {id: dv06, requires: [DATEVALUE], cells: {A1: '=DATEVALUE("abc")'}, expect: {A1: {error: "#VALUE!"}}}
- {id: dv07, requires: [DATEVALUE], cells: {A1: '=DATEVALUE("1/1/10000")'}, expect: {A1: {error: "#VALUE!"}}, note: "outside range"}
