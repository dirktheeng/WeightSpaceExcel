# Stage 5 conformance cases: statistical functions (modern names).
# Written 2026-11-06 by tests-345-agent. Format and conventions: see stage3/cases_math.yaml header.
# Microsoft examples print 6 to 10 significant digits; tol is set to match the printed precision.
# Source page per group: https://support.microsoft.com/en-us/excel/functions/<name with dots as dashes>-function
cases:
# AVEDEV
- {id: avedev01, requires: [AVEDEV], cells: {A1: "=AVEDEV(4,5,6,7,5,4,3)"}, expect: {A1: 1.020408163}, tol: 1e-9}
- {id: avedev02, requires: [AVEDEV], cells: {A1: "=AVEDEV(5)"}, expect: {A1: 0}, note: "edge single value"}
- {id: avedev03, requires: [AVEDEV], cells: {B1: "=AVEDEV(A1:A3)"}, expect: {B1: {error: "#NUM!"}}, note: "no numbers", confidence: medium}
# AVERAGE
- {id: avg01, requires: [AVERAGE], cells: {A1: "10", A2: "7", A3: "9", A4: "27", A5: "2", B1: "=AVERAGE(A1:A5)"}, expect: {B1: 11}}
- {id: avg02, requires: [AVERAGE], cells: {A1: "10", A2: "7", A3: "9", A4: "27", A5: "2", B1: "=AVERAGE(A1:A5,5)"}, expect: {B1: 10}}
- {id: avg03, requires: [AVERAGE], cells: {A1: "0", A2: "x", B1: "=AVERAGE(A1:A3)"}, expect: {B1: 0}, note: "zero counts, text and blank do not"}
- {id: avg04, requires: [AVERAGE], cells: {B1: "=AVERAGE(A1:A3)"}, expect: {B1: {error: "#DIV/0!"}}}
# AVERAGEA
- {id: avga01, requires: [AVERAGEA], cells: {A1: "10", A2: "7", A3: "9", A4: "2", A5: "Not available", B1: "=AVERAGEA(A1:A5)"}, expect: {B1: 5.6}}
- {id: avga02, requires: [AVERAGEA], cells: {A1: "10", A2: "7", A3: "9", A4: "2", B1: "=AVERAGEA(A1:A5)"}, expect: {B1: 7}, note: "blank ignored"}
- {id: avga03, requires: [AVERAGEA], cells: {A1: "TRUE", A2: "FALSE", B1: "=AVERAGEA(A1:A2)"}, expect: {B1: 0.5}}
- {id: avga04, requires: [AVERAGEA], cells: {B1: "=AVERAGEA(A1:A2)"}, expect: {B1: {error: "#DIV/0!"}}}
# AVERAGEIF
- {id: avgif01, requires: [AVERAGEIF], cells: {A1: "100000", A2: "200000", A3: "300000", A4: "400000", B1: "7000", B2: "14000", B3: "21000", B4: "28000", C1: '=AVERAGEIF(B1:B4,"<23000")'}, expect: {C1: 14000}}
- {id: avgif02, requires: [AVERAGEIF], cells: {A1: "100000", A2: "200000", A3: "300000", A4: "400000", C1: '=AVERAGEIF(A1:A4,"<250000")'}, expect: {C1: 150000}}
- {id: avgif03, requires: [AVERAGEIF], cells: {A1: "100000", A2: "200000", A3: "300000", A4: "400000", B1: "7000", B2: "14000", B3: "21000", B4: "28000", C1: '=AVERAGEIF(A1:A4,">250000",B1:B4)'}, expect: {C1: 24500}}
- {id: avgif04, requires: [AVERAGEIF], cells: {A1: "100000", A2: "200000", A3: "300000", A4: "400000", C1: '=AVERAGEIF(A1:A4,"<95000")'}, expect: {C1: {error: "#DIV/0!"}}}
# AVERAGEIFS
- {id: avgifs01, requires: [AVERAGEIFS], cells: {A1: "75", A2: "94", A3: "86", B1: "x", B2: "y", B3: "x", C1: '=AVERAGEIFS(A1:A3,B1:B3,"x")'}, expect: {C1: 80.5}}
- {id: avgifs02, requires: [AVERAGEIFS], cells: {A1: "75", A2: "94", A3: "86", B1: "x", B2: "y", B3: "x", C1: '=AVERAGEIFS(A1:A3,B1:B3,"x",A1:A3,">80")'}, expect: {C1: 86}}
