# T.TEST
- {id: ttest01, requires: [T.TEST], cells: {A1: "=T.TEST({3,4,5,8,9,1,2,4,5},{6,19,3,2,14,4,5,17,1},2,1)"}, expect: {A1: 0.196016}, tol: 1e-5}
- {id: ttest02, requires: [T.TEST], cells: {A1: "=T.TEST({1,2,3,4},{1,2,3,4},2,2)"}, expect: {A1: 1}, tol: 1e-12, note: "identical samples"}
- {id: ttest03, requires: [T.TEST], cells: {A1: "=T.TEST({1,2,3},{4,5,6},3,1)"}, expect: {A1: {error: "#NUM!"}}, note: "tails 3"}
# WEIBULL.DIST
- {id: weib01, requires: [WEIBULL.DIST], cells: {A1: "=WEIBULL.DIST(105,20,100,TRUE)"}, expect: {A1: 0.929581}, tol: 1e-6}
- {id: weib02, requires: [WEIBULL.DIST], cells: {A1: "=WEIBULL.DIST(105,20,100,FALSE)"}, expect: {A1: 0.035589}, tol: 1e-5}
- {id: weib03, requires: [WEIBULL.DIST], cells: {A1: "=WEIBULL.DIST(0,20,100,TRUE)"}, expect: {A1: 0}}
- {id: weib04, requires: [WEIBULL.DIST], cells: {A1: "=WEIBULL.DIST(105,0,100,TRUE)"}, expect: {A1: {error: "#NUM!"}}}
# Z.TEST
- {id: ztest01, requires: [Z.TEST], cells: {A1: "=Z.TEST({3,6,7,8,6,5,4,2,1,9},4)"}, expect: {A1: 0.090574}, tol: 1e-5}
- {id: ztest02, requires: [Z.TEST], cells: {A1: "=Z.TEST({3,6,7,8,6,5,4,2,1,9},6)"}, expect: {A1: 0.863043}, tol: 1e-6}
- {id: ztest03, requires: [Z.TEST], cells: {A1: "=Z.TEST({1,2,3},2)"}, expect: {A1: 0.5}, tol: 1e-14, note: "edge mean equals x"}
- {id: ztest04, requires: [Z.TEST], cells: {A1: "=Z.TEST({5,5,5},4)"}, expect: {A1: {error: "#DIV/0!"}}, note: "zero standard deviation"}
