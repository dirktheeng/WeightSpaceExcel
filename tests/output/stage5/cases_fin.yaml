# Stage 5 conformance cases: financial functions.
# Written 2026-11-06 by tests-345-agent. Format and conventions: see stage3/cases_math.yaml header.
# Values follow the Microsoft example for each function page
# (https://support.microsoft.com/en-us/excel/functions/<name>-function). Results printed to cents
# use abs_tol 0.005; others use tol matching the printed digits. DISC and ODDFYIELD examples were
# re-read on the live page this session; the rest are recalled examples (confidence medium where noted).
# Dates are typed as en-US date text in cells.
cases:
# ACCRINT
- {id: accrint01, requires: [ACCRINT], cells: {A1: "3/1/2008", A2: "8/31/2008", A3: "5/1/2008", B1: "=ACCRINT(A1,A2,A3,0.1,1000,2,0)"}, expect: {B1: 16.666667}, tol: 1e-7}
- {id: accrint02, requires: [ACCRINT], cells: {A1: "3/5/2008", A2: "8/31/2008", A3: "5/1/2008", B1: "=ACCRINT(A1,A2,A3,0.1,1000,2,0,FALSE)"}, expect: {B1: 15.555556}, tol: 1e-7, note: "calc_method FALSE: from first interest"}
- {id: accrint03, requires: [ACCRINT], cells: {A1: "3/1/2008", A2: "8/31/2008", A3: "5/1/2008", B1: "=ACCRINT(A1,A2,A3,0,1000,2,0)"}, expect: {B1: {error: "#NUM!"}}, note: "rate 0"}
- {id: accrint04, requires: [ACCRINT], cells: {A1: "3/1/2008", A2: "8/31/2008", A3: "5/1/2008", B1: "=ACCRINT(A1,A2,A3,0.1,1000,3,0)"}, expect: {B1: {error: "#NUM!"}}, note: "frequency 3"}
# ACCRINTM
- {id: accrintm01, requires: [ACCRINTM], cells: {A1: "4/1/2008", A2: "6/15/2008", B1: "=ACCRINTM(A1,A2,0.1,1000,3)"}, expect: {B1: 20.54794521}, tol: 1e-9}
- {id: accrintm02, requires: [ACCRINTM], cells: {A1: "4/1/2008", A2: "6/15/2008", B1: "=ACCRINTM(A1,A2,0.1,1000)"}, expect: {B1: 20.55555556}, tol: 1e-9, note: "basis 0: 74/360 of 100 (30/360 day count)", confidence: medium}
- {id: accrintm03, requires: [ACCRINTM], cells: {A1: "6/15/2008", A2: "4/1/2008", B1: "=ACCRINTM(A1,A2,0.1,1000,3)"}, expect: {B1: {error: "#NUM!"}}, note: "issue after settlement"}
