# Stage 3 conformance cases: math and trigonometry functions.
# Written 2026-11-06 by tests-345-agent before Stage 3 weights exist. Do not edit to fit results.
# Format as tests/output/stage1/cases.yaml plus: tol (relative), abs_tol, requires (checklist item names).
# Expected values paraphrase Microsoft support examples and documented rules; none computed by code.
# Source page per group: https://support.microsoft.com/en-us/excel/functions/<name>-function
# Settings: en-US, automatic calculation, 1900 date system.
cases:
# ABS https://support.microsoft.com/en-us/excel/functions/abs-function
- {id: abs01, requires: [ABS], cells: {A1: "=ABS(-4)"}, expect: {A1: 4}}
- {id: abs02, requires: [ABS], cells: {A1: "=ABS(0)"}, expect: {A1: 0}, note: edge}
- {id: abs03, requires: [ABS], cells: {A1: '=ABS("-2")'}, expect: {A1: 2}, note: "numeric text coerces"}
- {id: abs04, requires: [ABS], cells: {A1: '=ABS("x")'}, expect: {A1: {error: "#VALUE!"}}}
