- {id: istext04, requires: [ISTEXT], cells: {A1: "=ISTEXT(1/0)"}, expect: {A1: false}}
# N https://support.microsoft.com/en-us/excel/functions/n-function
- {id: n01, requires: [N], cells: {A1: "7", B1: "=N(A1)"}, expect: {B1: 7}}
