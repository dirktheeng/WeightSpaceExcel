# TEXT https://support.microsoft.com/en-us/excel/functions/text-function
- {id: text01, requires: [TEXT], cells: {A1: "1234.567", B1: '=TEXT(A1,"$#,##0.00")'}, expect: {B1: "$1,234.57"}}
- {id: text02, requires: [TEXT], cells: {A1: "0.285", B1: '=TEXT(A1,"0.0%")'}, expect: {B1: "28.5%"}}
- {id: text03, requires: [TEXT], cells: {A1: "12200000", B1: '=TEXT(A1,"0.00E+00")'}, expect: {B1: "1.22E+07"}}
- {id: text04, requires: [TEXT], cells: {A1: "1234", B1: '=TEXT(A1,"0000000")'}, expect: {B1: "0001234"}}
- {id: text05, requires: [TEXT], cells: {A1: '=TEXT("abc","0.00")'}, expect: {A1: "abc"}, note: "text passes through number format", confidence: medium}
- {id: text06, requires: [TEXT, NA], cells: {A1: '=TEXT(NA(),"0")'}, expect: {A1: {error: "#N/A"}}}
# TEXTAFTER https://support.microsoft.com/en-us/excel/functions/textafter-function
- {id: tafter01, requires: [TEXTAFTER], cells: {A1: "Red riding hood's, red hood", B1: '=TEXTAFTER(A1,"hood")'}, expect: {B1: "'s, red hood"}}
- {id: tafter02, requires: [TEXTAFTER], cells: {A1: "Red riding hood's, red hood", B1: '=TEXTAFTER(A1,"red",2,1)'}, expect: {B1: " hood"}, note: "case insensitive, second red"}
- {id: tafter03, requires: [TEXTAFTER], cells: {A1: "Red riding hood's, red hood", B1: '=TEXTAFTER(A1,"red",-2,1)'}, expect: {B1: " riding hood's, red hood"}, note: "negative instance counts from end"}
- {id: tafter03b, requires: [TEXTAFTER], cells: {A1: "Red riding hood's, red hood", B1: '=TEXTAFTER(A1,"red",2)'}, expect: {B1: {error: "#N/A"}}, note: "case sensitive: only one lowercase red"}
- {id: tafter04, requires: [TEXTAFTER], cells: {A1: "Red riding hood's, red hood", B1: '=TEXTAFTER(A1,"HOOD",,1)'}, expect: {B1: "'s, red hood"}, note: "match_mode 1 case insensitive"}
- {id: tafter05, requires: [TEXTAFTER], cells: {A1: '=TEXTAFTER("abc","z")'}, expect: {A1: {error: "#N/A"}}}
- {id: tafter06, requires: [TEXTAFTER], cells: {A1: '=TEXTAFTER("abc","z",,,,"none")'}, expect: {A1: "none"}, note: "if_not_found"}
- {id: tafter07, requires: [TEXTAFTER], cells: {A1: '=TEXTAFTER("abc","b",0)'}, expect: {A1: {error: "#VALUE!"}}}
