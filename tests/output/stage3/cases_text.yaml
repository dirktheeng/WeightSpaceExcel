# Stage 3 conformance cases: text functions.
# Written 2026-11-06 by tests-345-agent. Format and conventions: see cases_math.yaml header.
# B-variants (FINDB, LEFTB, ...) are tested under the en-US single-byte default, where they
# behave like the non-B forms; double-byte behavior depends on the editing language (low confidence).
cases:
# ARRAYTOTEXT https://support.microsoft.com/en-us/excel/functions/arraytotext-function
- {id: a2t01, requires: [ARRAYTOTEXT], cells: {A1: "1", A2: "a", B1: "=ARRAYTOTEXT(A1:A2,0)"}, expect: {B1: "1, a"}}
- {id: a2t02, requires: [ARRAYTOTEXT], cells: {A1: "1", A2: "a", B1: "=ARRAYTOTEXT(A1:A2,1)"}, expect: {B1: '{1;"a"}'}, note: "strict: rows separated by semicolon, text quoted"}
- {id: a2t03, requires: [ARRAYTOTEXT], cells: {A1: "TRUE", B1: "1", C1: "=ARRAYTOTEXT(A1:B1)"}, expect: {C1: "TRUE, 1"}}
- {id: a2t04, requires: [ARRAYTOTEXT], cells: {A1: "1", B1: "=ARRAYTOTEXT(A1,2)"}, expect: {B1: {error: "#VALUE!"}}, note: "format other than 0 or 1"}
# ASC https://support.microsoft.com/en-us/excel/functions/asc-function
- {id: asc01, requires: [ASC], cells: {A1: '=ASC("ＥＸＣＥＬ")'}, expect: {A1: "EXCEL"}, confidence: medium, note: "full width to half width"}
- {id: asc02, requires: [ASC], cells: {A1: '=ASC("Excel")'}, expect: {A1: "Excel"}, note: "already single byte"}
- {id: asc03, requires: [ASC, NA], cells: {A1: "=ASC(NA())"}, expect: {A1: {error: "#N/A"}}}
# BAHTTEXT https://support.microsoft.com/en-us/excel/functions/bahttext-function
- {id: baht01, requires: [BAHTTEXT], cells: {A1: "=BAHTTEXT(1234)"}, expect: {A1: "หนึ่งพันสองร้อยสามสิบสี่บาทถ้วน"}, confidence: medium}
- {id: baht02, requires: [BAHTTEXT], cells: {A1: "=BAHTTEXT(0)"}, expect: {A1: "ศูนย์บาทถ้วน"}, confidence: low}
- {id: baht03, requires: [BAHTTEXT], cells: {A1: '=BAHTTEXT("a")'}, expect: {A1: {error: "#VALUE!"}}}
# CHAR https://support.microsoft.com/en-us/excel/functions/char-function
- {id: char01, requires: [CHAR], cells: {A1: "=CHAR(65)"}, expect: {A1: "A"}}
- {id: char02, requires: [CHAR], cells: {A1: "=CHAR(33)"}, expect: {A1: "!"}}
- {id: char03, requires: [CHAR], cells: {A1: "=CHAR(65.9)"}, expect: {A1: "A"}, note: "truncated", confidence: medium}
- {id: char04, requires: [CHAR], cells: {A1: "=CHAR(0)"}, expect: {A1: {error: "#VALUE!"}}}
- {id: char05, requires: [CHAR], cells: {A1: "=CHAR(256)"}, expect: {A1: {error: "#VALUE!"}}}
# CLEAN https://support.microsoft.com/en-us/excel/functions/clean-function
- {id: clean01, requires: [CLEAN, CHAR], cells: {A1: '=CLEAN(CHAR(9)&"Monthly report"&CHAR(10))'}, expect: {A1: "Monthly report"}}
- {id: clean02, requires: [CLEAN], cells: {A1: '=CLEAN("abc")'}, expect: {A1: "abc"}}
- {id: clean03, requires: [CLEAN, LEN, CHAR], cells: {A1: "=LEN(CLEAN(CHAR(160)))"}, expect: {A1: 1}, note: "only codes 0 to 31 removed", confidence: medium}
- {id: clean04, requires: [CLEAN, NA], cells: {A1: "=CLEAN(NA())"}, expect: {A1: {error: "#N/A"}}}
# CODE https://support.microsoft.com/en-us/excel/functions/code-function
