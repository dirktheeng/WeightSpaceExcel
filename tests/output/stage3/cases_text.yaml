- {id: concatn02, requires: [CONCATENATE], cells: {A1: '=CONCATENATE("a","")'}, expect: {A1: "a"}}
- {id: concatn03, requires: [CONCATENATE], cells: {A1: "1.5", B1: "=CONCATENATE(A1,TRUE)"}, expect: {B1: "1.5TRUE"}}
- {id: concatn04, requires: [CONCATENATE], cells: {A1: '=CONCATENATE("a",1/0)'}, expect: {A1: {error: "#DIV/0!"}}}
