- {id: code02, requires: [CODE], cells: {A1: '=CODE("!")'}, expect: {A1: 33}}
- {id: code03, requires: [CODE], cells: {A1: '=CODE("Alphabet")'}, expect: {A1: 65}, note: "first character only"}
- {id: code04, requires: [CODE], cells: {A1: '=CODE("")'}, expect: {A1: {error: "#VALUE!"}}}
# CONCAT https://support.microsoft.com/en-us/excel/functions/concat-function
- {id: concat01, requires: [CONCAT], cells: {A1: '=CONCAT("The"," ","sun"," ","will"," ","come"," ","up"," ","tomorrow.")'}, expect: {A1: "The sun will come up tomorrow."}}
- {id: concat02, requires: [CONCAT], cells: {A1: "a", B1: "b", A2: "c", B2: "d", C1: "=CONCAT(A1:B2)"}, expect: {C1: "abcd"}, note: "range read row by row"}
- {id: concat03, requires: [CONCAT], cells: {A1: '=CONCAT(1,TRUE,"")'}, expect: {A1: "1TRUE"}}
- {id: concat04, requires: [CONCAT], cells: {B1: "=CONCAT(A1:A3)"}, expect: {B1: ""}, note: "blank range gives empty text"}
- {id: concat05, requires: [CONCAT, NA], cells: {A1: '=CONCAT("a",NA())'}, expect: {A1: {error: "#N/A"}}}
# CONCATENATE https://support.microsoft.com/en-us/excel/functions/concatenate-function
